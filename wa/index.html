<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Мегаполис — Написать в WhatsApp</title>
  <meta name="robots" content="noindex, nofollow">

  <!--
    ═══════════════════════════════════════════════════════════════════
    КОНФИГУРАЦИЯ — замените плейсхолдеры перед деплоем
    ═══════════════════════════════════════════════════════════════════
    1. METRICA_COUNTER_ID  — номер счётчика Яндекс.Метрики
    2. WA_PHONE            — номер WhatsApp (без + и пробелов, например 79991234567)
    3. OLCHAT_SCRIPT_URL   — URL скрипта Link Modifier из кабинета OLChat
    ───────────────────────────────────────────────────────────────────
  -->

  <!-- ═══ Яндекс.Метрика ═══ -->
  <script>
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();
    for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window,document,"script","https://mc.yandex.ru/metrika/tag.js","ym");

    ym(METRICA_COUNTER_ID, "init", {
      clickmap:            true,
      trackLinks:          true,
      accurateTrackBounce: true,
      webvisor:            true
    });
  </script>
  <noscript>
    <div>
      <img src="https://mc.yandex.ru/watch/METRICA_COUNTER_ID"
           style="position:absolute;left:-9999px;" alt="" />
    </div>
  </noscript>

  <!-- ═══ OLChat Link Modifier — конфигурация (до загрузки скрипта) ═══ -->
  <script>
    window.OLChatLinkModifier = {
      // Шаблон первого сообщения — должен совпадать с настройками в кабинете OLChat
      messageTemplate: "Здравствуйте! Интересует квартира. Код: {visit_id}",
      // Включить подстановку visit_id в ссылки WhatsApp
      modifyWhatsApp: true,
      // Источник visit_id — Яндекс.Метрика
      counterType: "metrica",
      counterId: METRICA_COUNTER_ID
    };
  </script>

  <!-- ═══ OLChat Link Modifier — скрипт ═══
       URL берётся из личного кабинета OLChat → Настройки → Link Modifier
  -->
  <script src="OLCHAT_SCRIPT_URL" async></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f8;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,.10);
      padding: 40px 32px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { width: 42px; height: 42px; fill: #fff; }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    p {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ═══ Главная кнопка WhatsApp ═══
         href — подставляется OLChat Link Modifier,
         добавляя ?text=...{visit_id}... к ссылке wa.me
    */
    .wa-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      border-radius: 14px;
      padding: 16px 28px;
      width: 100%;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 18px rgba(37,211,102,.35);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .wa-btn:hover  { background: #20c05c; box-shadow: 0 6px 24px rgba(37,211,102,.45); }
    .wa-btn:active { transform: scale(0.97); }

    .wa-btn svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <!-- WhatsApp icon -->
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 3C9.37 3 4 8.37 4 15c0 2.33.65 4.51 1.77 6.38L4 29l7.84-1.73A11.94 11.94 0 0016 28c6.63 0 12-5.37 12-12S22.63 3 16 3zm0 22c-1.96 0-3.8-.54-5.38-1.47l-.38-.23-4.65 1.03 1.05-4.52-.25-.4A9.94 9.94 0 016 15c0-5.52 4.48-10 10-10s10 4.48 10 10-4.48 10-10 10zm5.48-7.5c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.79-1.67-2.09-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.02-1.04 2.48 1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.1 4.49.71.31 1.27.49 1.7.63.72.23 1.37.2 1.89.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/>
    </svg>
  </div>

  <h1>Мегаполис Груп</h1>
  <p>Нажмите кнопку ниже, чтобы написать нам в WhatsApp — ответим быстро.</p>

  <!--
    ВАЖНО: href содержит только базовую ссылку wa.me.
    OLChat Link Modifier автоматически добавит параметр text= с visit_id
    до того, как пользователь перейдёт по ссылке.

    Замените WA_PHONE на реальный номер (пример: 79991234567).
  -->
  <a id="wa-link"
     href="https://wa.me/WA_PHONE"
     class="wa-btn"
     target="_blank"
     rel="noopener noreferrer">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 3C9.37 3 4 8.37 4 15c0 2.33.65 4.51 1.77 6.38L4 29l7.84-1.73A11.94 11.94 0 0016 28c6.63 0 12-5.37 12-12S22.63 3 16 3zm0 22c-1.96 0-3.8-.54-5.38-1.47l-.38-.23-4.65 1.03 1.05-4.52-.25-.4A9.94 9.94 0 016 15c0-5.52 4.48-10 10-10s10 4.48 10 10-4.48 10-10 10zm5.48-7.5c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.79-1.67-2.09-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.02-1.04 2.48 1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.1 4.49.71.31 1.27.49 1.7.63.72.23 1.37.2 1.89.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/>
    </svg>
    Написать в WhatsApp
  </a>

  <p class="notice">Нажимая кнопку, вы перейдёте в приложение WhatsApp</p>
</div>

<!--
  ═══════════════════════════════════════════════════════════════════
  Запасная логика: если OLChat Link Modifier не загрузился
  (например, скрипт заблокирован), кнопка всё равно работает
  — просто без visit_id в сообщении.
  ═══════════════════════════════════════════════════════════════════
-->
<script>
  (function () {
    // Читаем UTM / src параметры из текущего URL
    var params = new URLSearchParams(window.location.search);
    var src = params.get('src') || '';

    // Если OLChatLinkModifier не смог подставить visit_id —
    // добавляем хотя бы src в text= сообщения как fallback
    window.addEventListener('load', function () {
      var link = document.getElementById('wa-link');
      if (!link) return;

      var href = link.getAttribute('href');
      // Проверяем: если OLChat уже добавил text= — ничего не делаем
      if (href.indexOf('text=') !== -1) return;

      // Fallback: отправляем сообщение без visit_id, но с src
      var text = 'Здравствуйте! Интересует квартира.';
      if (src) text += ' Источник: ' + src;
      link.setAttribute('href', href + '?text=' + encodeURIComponent(text));
    });
  })();
</script>

</body>
</html>
